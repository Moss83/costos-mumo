<div class="flex flex-col justify-between items-center py-4 bg-indigo-600 w-[70rem] h-[40rem]">
    <p class="text-3xl text-white font-medium">Editar Costos</p>
    <div class="flex justify-center">
        <div class="flex flex-col items-center overflow-y-auto w-[55rem] h-[30rem] bg-gray-300 rounded-2xl space-y-5 pb-4">
            <ng-container *ngFor="let ingrediente of data">
                <div [id]="ingrediente.idingrediente.toString() + 'E'" (mouseover)="addStyleIngrediente(ingrediente.idingrediente.toString() + 'E')" (mouseout)="removeStyleIngrediente(ingrediente.idingrediente.toString() + 'E')" [ngStyle]="{'background-color': '#FFFFFF'}" class="flex items-center text-2xl font-medium justify-between rounded-2xl w-11/12 h-14 px-4 pt-3 mt-4">
                    <div class="flex flex-row relative space-x-1">
                        <mat-checkbox class="ingrediente-editado" [checked]="ingrediente.checked" (change)="onCheckChange(ingrediente)"></mat-checkbox>
                        <p>{{ ingrediente.nombre }}</p>
                    </div>
                    <div class="flex flex-row w-54 relative space-x-2">
                        <div class="flex flex-row space-x-1">
                            <p>$</p>
                            <p>{{ ingrediente.precioAnterior | number: '1.2-2' }}</p>
                        </div>
                        <div>
                            <p>→</p>
                        </div>
                        <div class="flex flex-row space-x-1">
                            <p>$</p>
                            <p>{{ ingrediente.precioActual | number: '1.2-2' }}</p>
                        </div>
                        <div class="">
                            <p>/{{ ingrediente.unidadmedida }}</p>
                        </div>
                    </div>
                </div>
            </ng-container>
        </div>
    </div>
    <div class="flex flex-row space-x-[17rem]">
        <button class="text-xl text-black font-medium bg-gray-300 rounded-xl w-[9rem] h-10" id="cancelar" (mouseover)="addStyleBoton('cancelar')" (mouseout)="removeStyleBoton('cancelar')" (click)="onAtrasClick()">
            Cancelar
        </button>
        <button class="text-xl text-white font-medium bg-pink-500 rounded-xl w-[9rem] h-10" id="confirmar" (mouseover)="addStyleBoton('confirmar')" (mouseout)="removeStyleBoton('confirmar')" (click)="onConfirmarClick()">
            Confirmar
        </button>
    </div>
</div>
